[project]
name = "steam-game-analyst"
version = "0.1.0"
description = "Local LLM agent that answers analytical questions about Steam games with RAG over reviews, patch notes and wikis plus data-science tools."
authors = [{ name = "Philippe Simons" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.9",
    "pyarrow>=17.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "rich>=13.8",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "lingua-language-detector>=2.0",
    "langchain-openai>=0.3",
]

[project.optional-dependencies]
# Retrieval + agent stack (W2/W3). Kept optional so `make data` works in a slim image.
rag = [
    "langgraph>=0.2.50",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "langchain-qdrant>=0.2",
    "qdrant-client>=1.12",
    "sentence-transformers>=3.2",
    "bm25s>=0.2",
    "mwparserfromhell>=0.6",
]
ml = [
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "shap>=0.46",
    "transformers>=4.45",
    "datasets>=3.0",
    "accelerate>=1.0",
]
ui = [
    "streamlit>=1.39",
    "plotly>=5.24",
]
notebooks = [
    "jupyterlab>=4.2",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[project.scripts]
sga = "steam_game_analyst.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/steam_game_analyst"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
