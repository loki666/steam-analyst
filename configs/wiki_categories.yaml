# Franchise wikis: which of a wiki's pages belong to each subset game (`sga data download-wiki`).
# A franchise wiki also covers games outside the subset (Borderlands 2 and 4 on the Borderlands
# wiki), so a game listed here takes only pages in categories named by its prefixes (whole
# words: "Battlefield 1" takes "Battlefield 1: Turning Tides", not "Battlefield 1942").
# Every game on a wiki with an entry here needs one too, or it gets no pages from that wiki.
# Games on a franchise wiki with no per-game category are pinned to null in wikis.yaml.
# Category names were looked up with the wikis' allcategories API on 2026-10-07.
#
# appid: [prefix, ...]   or   appid: {prefixes: [...], exclude: [...]}

