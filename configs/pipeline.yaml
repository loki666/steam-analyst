# Data pipeline configuration (W1). Environment variables SGA_* override the matching keys.

sources:
  catalog:
    # FronkonGames Steam Games Dataset (MIT). HF mirror of the Kaggle dataset.
    hf_repo: FronkonGames/steam-games-dataset
    hf_file: games.csv            # falls back to the first .parquet/.csv in the repo if absent
  reviews:
    # Steam Games Metadata and Player Reviews 2020–2024, Mendeley Data v2 (Univ. of Wollongong).
    # The dataset is a zip of games.json + one CSV per game named <AppID>_<reviewcount>.csv.
    mendeley_id: jxy85cr3th
    mendeley_version: 2
  news:
    # Steam Web API, ISteamNews/GetNewsForApp — needs STEAM_API_KEY in .env
    count: 200                   # max news items per app
    maxlength: 0                 # 0 = full contents
    feeds: "steam_community_announcements"   # patch notes / announcements only; empty = all feeds
    rate_limit_per_sec: 2
  wiki:
    # Fandom wikis (CC BY-SA 3.0) via each wiki's MediaWiki API. The nyuuzyou/fandom HF dump
    # has no per-page wiki id, so it cannot be filtered to our games.
    max_pages_per_wiki: 300      # largest main-namespace articles
    min_page_bytes: 1500         # skip stubs
    rate_per_sec: 2
    overrides_file: wikis.yaml   # configs/wikis.yaml: appid -> slug (or null to skip)

subset:
  n_games: 300                   # SGA_SUBSET_GAMES
  reviews_per_game: 1500         # SGA_REVIEWS_PER_GAME; stratified by (voted_up, year)
  min_reviews: 500               # reviews available in any language
  release_from: "2020-01-01"
  release_to: "2024-12-31"
  # Mendeley has no language column: every sampled review is language-tagged with lingua.
  # Empty keeps all languages (bge-m3 is multilingual); e.g. ["english"] filters before sampling.
  languages: []
  # Spread the subset across genres so it is not 300 shooters.
  genre_quota: 40                # max games per primary genre
  # Always include these appids (live-service / early-access titles with rich patch histories).
  must_include: [1245620, 1091500, 892970, 1623730, 1145360, 1145350, 2379780, 1086940, 1174180, 1938090, 2358720]
  # Non-game software genres. Apps with any of these, or with no genre at all, are skipped
  # (must_include still wins).
  exclude_genres:
    - Accounting
    - Animation & Modeling
    - Audio Production
    - Design & Illustration
    - Education
    - Game Development
    - Photo Editing
    - Software Training
    - Utilities
    - Video Production
    - Web Publishing

cleaning:
  min_review_chars: 20
  max_review_chars: 4000
  drop_duplicates_on: ["appid", "review_text"]
  strip_html: true

paths:
  raw: data/raw
  processed: data/processed
  duckdb: data/processed/sga.duckdb
